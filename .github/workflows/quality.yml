name: Aurum quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python projection/project_tasks.py
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 0
      - run: npm test > evidence/task-tests.tap 2>&1
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run qa:browser
      - run: npm run benchmark:tasks
      - run: npm run verify:drift
      - run: npm run package:release
      - run: npm run qa:browser
        env:
          AURUM_RELEASE_SERVER: .release/app/server.js
      - run: node scripts/task-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-game-evidence-${{ github.sha }}
          path: evidence/
          retention-days: 14
